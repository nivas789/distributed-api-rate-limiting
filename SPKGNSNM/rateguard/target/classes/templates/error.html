<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RateGuard X - Error Page')}">
</head>
<body class="flex align-center justify-center flex-column" style="background-color: var(--bg-main); min-height: 100vh; padding: 24px; text-align: center;">

    <div class="fade-in" style="max-width: 480px; width: 100%;">
        <div class="auth-logo" style="margin-bottom: 24px;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke="var(--danger)" stroke-width="2" fill="none"/>
                <line x1="12" y1="9" x2="12" y2="13" stroke="var(--danger)" stroke-width="2"/>
                <line x1="12" y1="17" x2="12.01" y2="17" stroke="var(--danger)" stroke-width="2"/>
            </svg>
        </div>
        
        <h1 style="font-size: 5rem; font-weight: 800; color: var(--danger); line-height: 1;" class="text-gradient">Error</h1>
        <h2 style="font-size: 1.5rem; margin-top: 12px; margin-bottom: 16px;">Shield Breached or Route Lost</h2>
        <p class="text-muted" style="margin-bottom: 32px; font-size: 0.95rem; line-height: 1.6;">
            The requested resource is unavailable, or a server-side exception occurred. Rest assured, our rate limit engines are still standing.
        </p>

        <div class="flex justify-center gap-16">
            <a th:href="@{/dashboard}" href="/dashboard" class="btn btn-primary" style="padding: 12px 28px;">
                <span>Back to Dashboard</span>
            </a>
            <a th:href="@{/}" href="/" class="btn btn-secondary" style="padding: 12px 28px;">
                <span>Return Home</span>
            </a>
        </div>
    </div>

</body>
</html>
