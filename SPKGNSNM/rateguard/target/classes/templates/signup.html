<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RateGuard X - Create Account')}">
</head>
<body class="flex align-center justify-center" style="background-color: var(--bg-main); padding: 40px 0;">

    <div class="auth-container">
        <!-- Logo and Brand Header -->
        <header class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M12 8v8M9 12h6" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="brand-name">RateGuard <span>X</span></h1>
            <p class="brand-tagline">API Protection & Traffic Intelligence</p>
        </header>

        <!-- Authentication Card -->
        <main class="auth-card">
            <h2 class="auth-title">Get started</h2>
            <p class="auth-subtitle">Already have an account? <a th:href="@{/login}" href="/login" id="login-link">Sign in</a></p>

            <!-- Error Alerts -->
            <div id="error-alert" class="alert-box hidden" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-message">Registration failed. Please try again.</span>
            </div>

            <!-- Form -->
            <form id="signup-form" novalidate>
                <!-- Full Name Input -->
                <div class="floating-group">
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        class="floating-control" 
                        placeholder="John Doe" 
                        required
                    >
                    <label for="fullName" class="floating-label">Full Name</label>
                </div>

                <!-- Email Input -->
                <div class="floating-group">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="floating-control" 
                        placeholder="name@company.com" 
                        required
                    >
                    <label for="email" class="floating-label">Email Address</label>
                </div>

                <!-- Password Input -->
                <div class="floating-group">
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="floating-control" 
                            placeholder="At least 6 characters" 
                            required
                            style="padding-right: 44px;"
                        >
                        <label for="password" class="floating-label">Password</label>
                        <button type="button" id="password-toggle" class="password-toggle" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="floating-group">
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="floating-control" 
                            placeholder="Re-enter password" 
                            required
                            style="padding-right: 44px;"
                        >
                        <label for="confirmPassword" class="floating-label">Confirm Password</label>
                        <button type="button" id="confirm-password-toggle" class="password-toggle" aria-label="Toggle password visibility">
                            <svg id="confirm-eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <div class="form-actions" style="margin-bottom: 2rem; display: flex; align-items: center;">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="custom-checkmark"></span>
                        <span style="font-size: 0.8125rem;">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">
                    <span>Create Free Account</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </main>

        <footer class="auth-footer">
            <p>&copy; 2026 RateGuard X. All rights reserved.</p>
        </footer>
    </div>

    <!-- Reusable Toast component target container -->
    <div th:replace="~{fragments/toast :: toast}"></div>

    <script th:src="@{/js/signup.js}" src="/js/signup.js"></script>
</body>
</html>
