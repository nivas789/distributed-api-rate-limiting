<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="navbar(pageTitle)" class="app-header">
        <div class="header-title-section">
            <button class="menu-toggle-btn" id="sidebar-toggle" aria-label="Toggle Sidebar">
                <svg viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h2 class="header-title" th:text="${pageTitle}">Dashboard Overview</h2>
        </div>
        
        <div class="header-actions">
            <!-- Theme Toggle Button -->
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Light/Dark Theme">
                <svg class="moon-icon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>

            <!-- Profile Dropdown Trigger -->
            <div class="profile-dropdown-wrapper">
                <div class="profile-trigger" id="profile-trigger">
                    <div class="avatar" th:text="${initials}">SA</div>
                    <div class="profile-meta" style="display: none; md: flex;">
                        <span class="profile-name" th:text="${user.fullName}">System Admin</span>
                        <span class="profile-email" th:text="${user.email}">admin@rateguard.io</span>
                    </div>
                </div>
                <div class="dropdown-menu" id="profile-dropdown">
                    <div style="padding: 8px 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px;">
                        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-primary);" th:text="${user.fullName}">System Admin</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); word-break: break-all;" th:text="${user.email}">admin@rateguard.io</div>
                    </div>
                    <a th:href="@{/settings}" href="/settings" class="dropdown-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>Profile Settings</span>
                    </a>
                    <a th:href="@{/logout}" href="/logout" class="dropdown-item logout" style="border-top: 1px solid var(--border-color); margin-top: 4px;">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Sign Out</span>
                    </a>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
